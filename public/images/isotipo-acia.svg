<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 262 262" role="img">
  <title>ACIA</title>
  <!--
    Solo la lente, sin anillos ni conectores: a tamaño de favicon o de avatar
    esos trazos se convierten en manchas (MARCA.md, §2).

    No basta con recortar el encuadre de la marca completa, que es lo que se
    hacía antes: las formas seguían en el archivo y el borde del viewBox las
    cortaba a hueso, dejando tres diagonales truncadas contra las esquinas.

    Geometría tomada de logo-acia.svg: lente de radio 119; brillo de radio 78 y
    grosor 34, de 300° a 345°, concéntrico con el canto.
  -->
  <circle cx="131" cy="131" r="119" fill="#2e5e4e"/>
  <path d="M 170 63.45 A 78 78 0 0 1 206.34 110.81"
        fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
</svg>
